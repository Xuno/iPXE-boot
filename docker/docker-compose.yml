# docker compose --progress=plain up --build base-os
name: ipxe
services:
  # The Base OS (Kernel + RootFS)
  base-os:
    image: ipxe-base-os
    build:
      context: ./base
      dockerfile: Dockerfile
    volumes:
      - /srv/ipxe/boots/ubuntu:/docker
      - ./entrypoint:/tmp/entrypoint

    command: /bin/bash -c "/tmp/entrypoint/build.sh"

  # The App Layer (Dependent on Base OS)
  apps:
    build:
      context: ./apps
      dockerfile: Dockerfile
      # This tells Docker that 'app-layer' relies on 'base-os'
      additional_contexts:
        base_image: service:base-os
      args:
        RUST_VERSION: ${RUST_VERSION:-1.94.1}
        RUST_ARCH: ${RUST_ARCH:-x86_64-unknown-linux-gnu}
        RUST_DIST_BASE: ${RUST_DIST_BASE:-https://static.rust-lang.org/dist}
        RUST_KEY_URL: ${RUST_KEY_URL:-https://keybase.io/rust/pgp_keys.asc}
        RUST_SIGNING_FPR: ${RUST_SIGNING_FPR:-108F66205EAEB0AAA8DD5E1C85AB96E6FA1BE5FE}
    volumes:
      - ./http/boots/ubuntu:/out
