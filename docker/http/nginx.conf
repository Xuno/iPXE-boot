# Nginx configuration for PXE boot server
# Serves iPXE boot scripts and Ubuntu filesystem layers

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance tuning for diskless boot
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 0;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Serve iPXE boot scripts
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # iPXE entrypoint and NoCloud seed data.
        location ~ \.ipxe$ {
            default_type text/plain;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /cloud-init/ {
            alias /usr/share/nginx/html/cloud-init/;
            default_type text/plain;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            autoindex off;
        }

        # Versioned kernel/initrd/squashfs artifacts from the older layer build.
        location /boots/ubuntu/ {
            alias /var/www/boots/ubuntu/;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=3600";
            add_header X-MTU 9000;
            autoindex off;
        }

        # Compatibility path for older documentation/scripts.
        location /ubuntu/ {
            alias /var/www/boots/ubuntu/;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=3600";
            add_header X-MTU 9000;
            autoindex off;
        }

        # Custom live-server ISO and extracted casper boot files.
        location /iso/ {
            alias /var/www/iso/;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=3600";
            add_header X-MTU 9000;
            autoindex off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

}
